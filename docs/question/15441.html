<script>
/* ── 侧边栏折叠 ── */
(function(){
  var toggle = document.getElementById('sidebarToggle');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  if(!toggle) return;

  function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('open'); }

  toggle.addEventListener('click', function(){
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  /* 点击导航链接后自动收起 */
  sidebar.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ if(window.innerWidth <= 900) closeSidebar(); });
  });
})();

/* ── 公式块复制按钮注入 ── */
(function(){
  function injectCopyBtns(){
    document.querySelectorAll('.katex-display').forEach(function(kd){
      if(kd.querySelector('.formula-copy-btn')) return;
      var btn = document.createElement('button');
      btn.className = 'formula-copy-btn';
      btn.textContent = '复制';
      btn.setAttribute('aria-label','复制公式');
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var mathEl = kd.querySelector('annotation');
        var text = mathEl ? mathEl.textContent.trim() : kd.textContent.trim();
        navigator.clipboard.writeText(text).then(function(){
          btn.textContent = '已复制';
          btn.classList.add('copied');
          setTimeout(function(){ btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
        }).catch(function(){ /* fallback: no-op */ });
      });
      kd.style.position = 'relative';
      kd.appendChild(btn);
    });
  }
  /* KaTeX auto-render 是 defer, 等 DOMContentLoaded 后再注入 */
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(injectCopyBtns, 300); });
  } else {
    setTimeout(injectCopyBtns, 300);
  }
  /* MutationObserver 兜底:SPA 动态内容 */
  if(typeof MutationObserver !== 'undefined'){
    new MutationObserver(function(){ setTimeout(injectCopyBtns, 200); })
      .observe(document.body, {childList:true, subtree:true});
  }
})();
</script>
