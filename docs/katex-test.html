<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>KaTeX 测试</title>
<link rel="stylesheet" href="/GaokaoMathBank/static/katex/katex.min.css">
<script src="/GaokaoMathBank/static/katex/katex.min.js"></script>
<script src="/GaokaoMathBank/static/katex/auto-render.min.js"></script>
<style>
body { font-family: -apple-system, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; }
.test-box { background: #f5f5f7; border-radius: 12px; padding: 20px; margin: 20px 0; }
</style>
</head>
<body>
<h1>KaTeX 渲染测试</h1>

<div class="test-box">
<h2>测试 1: 简单公式</h2>
<p>$x^2 + y^2 = z^2$</p>
</div>

<div class="test-box">
<h2>测试 2: 集合公式（题目 15133）</h2>
<p>已知集合$M={ x\mid -1<x<3 }$，$N={ x\mid x\ge 2 }$，则$M\cup N=$（ ）</p>
</div>

<div class="test-box">
<h2>测试 3: 行内公式</h2>
<p>$a+b=c$，$E=mc^2$，$\sin^2\theta + \cos^2\theta = 1$</p>
</div>

<div class="test-box">
<h2>测试 4: 显示公式</h2>
<p>$$\int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}$$</p>
</div>

<div class="test-box">
<h2>手动渲染测试</h2>
<div id="manual-render"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  console.log('[KaTeX] katex:', typeof katex, 'renderMathInElement:', typeof renderMathInElement);

  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
    console.log('[KaTeX] renderMathInElement 调用完成');
  } else {
    console.error('[KaTeX] renderMathInElement 未定义!');
  }

  // 手动渲染测试
  var manualEl = document.getElementById('manual-render');
  if (manualEl && typeof katex !== 'undefined') {
    katex.render('M = { x \\mid -1 < x < 3 }', manualEl, {throwOnError: false});
    console.log('[KaTeX] 手动渲染完成');
  }
});
</script>
</body>
</html>
