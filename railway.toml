[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# 挂载持久化卷存储 SQLite 数据库和资源文件
[[mounts]]
name = "data"
path = "/app/data"

# 健康检查
[[services.healthChecks]]
path = "/"
interval = 30
timeout = 10
