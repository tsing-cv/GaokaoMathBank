name: Build and Deploy Static Site to GitHub Pages

on:
  # 推送到 main 分支时触发
  push:
    branches: [main, master]

  # 手动触发
  workflow_dispatch:

  # 每周日 UTC 00:00 自动重建（可选）
  schedule:
    - cron: '0 0 * * 0'

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，跳过正在进行的运行之间的排队部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # 获取所有历史记录以用于分析
          fetch-depth: 0

      # 2. 设置 Python 环境
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 安装 Python 依赖
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # 4. 安装系统依赖（Pango 用于 PDF 生成）
      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info

      # 5. 检查数据库文件
      - name: 🔍 Check database
        run: |
          if [ ! -f data/mathbank.db ]; then
            echo "❌ 数据库文件不存在: data/mathbank.db"
            echo "请先运行数据采集脚本"
            exit 1
          fi
          echo "✅ 数据库文件存在"
          ls -lh data/mathbank.db

      # 6. 生成静态网站
      - name: 🏗️ Build static site
        run: |
          echo "开始生成静态网站..."
          python scripts/render_static.py
          echo "静态网站生成完成"

      # 7. 验证生成的文件
      - name: ✅ Validate build output
        run: |
          if [ ! -d docs ]; then
            echo "❌ docs 目录不存在"
            exit 1
          fi

          if [ ! -f docs/index.html ]; then
            echo "❌ docs/index.html 不存在"
            exit 1
          fi

          echo "✅ 构建验证通过"
          echo "📊 生成文件统计:"
          find docs -type f | wc -l | xargs echo "  总文件数:"
          du -sh docs | xargs echo "  总大小:"

      # 8. 上传构建产物
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      # 9. 显示部署信息
      - name: ℹ️ Show deployment info
        run: |
          echo "✅ 静态网站构建完成！"
          echo ""
          echo "📊 构建信息:"
          echo "  分支: ${{ github.ref_name }}"
          echo "  提交: ${{ github.sha }}"
          echo "  时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "🚀 下一步: 自动部署到 GitHub Pages"

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # 部署到 GitHub Pages
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 显示部署结果
      - name: ✅ Show deployment result
        run: |
          echo ""
          echo "🎉 部署成功！"
          echo ""
          echo "🌐 访问地址:"
          echo "  ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📱 主要页面:"
          echo "  首页: ${{ steps.deployment.outputs.page_url }}"
          echo "  试卷库: ${{ steps.deployment.outputs.page_url }}papers/"
          echo "  题库检索: ${{ steps.deployment.outputs.page_url }}questions/"
          echo "  知识点专题: ${{ steps.deployment.outputs.page_url }}topics/"
          echo ""
          echo "💡 提示:"
          echo "  - 首次部署可能需要 1-2 分钟生效"
          echo "  - 清除浏览器缓存以查看最新版本"
          echo "  - 如有问题，请检查 GitHub Pages 设置"

      # 发送部署通知（可选）
      - name: 📢 Send notification
        if: success()
        run: |
          echo "✅ 部署成功通知"
          echo "网站已更新: ${{ steps.deployment.outputs.page_url }}"
          # 这里可以添加其他通知方式（邮件、Slack等）
